<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il tuo riordino — Cereria Cicogna</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css?v=13">
  <style>
    .rd-hero { padding: 160px var(--gutter) 40px; background: var(--c-dark); color: var(--c-vellum); text-align: center; }
    .rd-eyebrow { font-family: var(--ff-sans); font-size: .5rem; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; color: var(--c-gold); margin-bottom: 18px; }
    .rd-title { font-family: var(--ff-display); font-size: clamp(1.8rem, 4.4vw, 3rem); font-weight: 300; letter-spacing: .03em; line-height: 1.15; }
    .rd-sub { font-family: var(--ff-serif); font-style: italic; font-size: 1rem; color: var(--c-stone); max-width: 56ch; margin: 18px auto 0; line-height: 1.7; }
    .rd-body { background: var(--c-light-bg, #FAFAF8); padding: 60px var(--gutter) 100px; min-height: 40vh; }
    .rd-wrap { max-width: 640px; margin: 0 auto; }
    .rd-stato { text-align: center; font-family: var(--ff-serif); font-size: 1.05rem; color: var(--c-text-mid, #4a443b); padding: 40px 0; }
    .rd-riga { display: flex; gap: 18px; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid rgba(26,22,16,.1); }
    .rd-riga img { width: 68px; height: 86px; object-fit: cover; background: var(--c-cream, #F5EEE2); flex: 0 0 auto; }
    .rd-riga-txt { flex: 1; min-width: 0; }
    .rd-riga-nome { font-family: var(--ff-serif); font-size: 1.05rem; color: var(--c-text-dark, #1a1610); margin: 0 0 6px; }
    .rd-riga-qta { font-family: var(--ff-sans); font-size: .68rem; letter-spacing: .06em; color: var(--c-text-mid, #6b6355); }
    .rd-non-disp { display: inline-block; margin-top: 6px; font-family: var(--ff-sans); font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; color: #a4401f; }
    .rd-cta-wrap { text-align: center; margin-top: 44px; }
    .rd-cta { display: inline-block; background: var(--c-dark); color: #fff; font-family: var(--ff-sans); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; padding: 16px 44px; text-decoration: none; border: 0; cursor: pointer; }
    .rd-cta:hover { background: #2C2416; }
    .rd-nota { text-align: center; font-family: var(--ff-sans); font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; color: var(--c-text-mid, #6b6355); margin-top: 16px; }
    .rd-home { display: inline-block; margin-top: 26px; font-family: var(--ff-sans); font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; color: var(--c-text-dark, #1a1610); text-decoration: underline; }
  </style>
</head>
<body class="light-page">
  <nav id="main-nav" style="position:static;background:var(--c-dark);">
    <a href="index.html" class="nav-brand">
      <img class="nav-stork" src="logo-stork.png" alt="Logo Cereria Cicogna" width="32" height="32" loading="eager">
      <div class="nav-logo">Cereria Cicogna<span>Industria F.lli Cicogna · Novate Milanese</span></div>
    </a>
  </nav>

  <header class="rd-hero">
    <p class="rd-eyebrow" id="rd-eyebrow">Il tuo riordino</p>
    <h1 class="rd-title" id="rd-titolo">Un attimo, stiamo recuperando il tuo ordine…</h1>
    <p class="rd-sub" id="rd-sottotitolo"></p>
  </header>

  <main class="rd-body">
    <div class="rd-wrap">
      <div id="rd-contenuto"></div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <span class="footer-copy">&copy; 2025 Industria Ceraria F.lli Cicogna srl</span>
      <span class="footer-legal">P.IVA 11980500158 &nbsp;&middot;&nbsp; <a href="privacy.html">Privacy</a></span>
    </div>
  </footer>

  <script src="js/cc-api.js"></script>
  <script src="js/selection.js?v=7"></script>
  <script src="js/i18n-pages.js?v=3"></script>
  <script src="js/i18n.js?v=8"></script>
  <script>
    (function () {
      'use strict';

      /* ── due lingue, stesso schema di js/link-personale.js: il contenuto
         di questa pagina è tutto costruito da JS con dati del cliente
         (nome, date, prodotti), quindi non basta il dizionario testo-per-
         testo di js/i18n.js — ogni stringa dinamica si sceglie da qui. */
      var T = {
        it: {
          eyebrow: 'Il tuo riordino',
          caricamento: 'Un attimo, stiamo recuperando il tuo ordine…',
          erroreTitolo: 'Questo collegamento non è più valido',
          erroreSotto: 'Può essere scaduto, oppure il promemoria non esiste più.',
          erroreCorpo: function (a) { return 'Se hai bisogno di riordinare, scrivici pure dalla pagina ' + a + ': sarà un attimo.'; },
          contatti: 'Contatti',
          bentornato: function (nome) { return nome ? 'Bentornato, ' + nome : 'Il tuo ordine precedente'; },
          conData: function (data) { return 'Ecco cosa avevi richiesto il ' + data + '. Puoi modificare le quantità o toglierne alcuni prima di inviare.'; },
          senzaData: 'Ecco i prodotti del tuo ultimo ordine.',
          pezzi: 'pz',
          nonDisponibile: 'Non più disponibile',
          cta: 'Modifica e invia la richiesta',
          nota: 'Ti portiamo al modulo di contatto, con tutto già pronto: potrai ancora cambiare quantità o togliere articoli.',
          dataLocale: 'it-IT',
        },
        en: {
          eyebrow: 'Your reorder',
          caricamento: 'One moment, we are retrieving your order…',
          erroreTitolo: 'This link is no longer valid',
          erroreSotto: 'It may have expired, or the reminder no longer exists.',
          erroreCorpo: function (a) { return 'If you need to reorder, just write to us from the ' + a + ' page: it will only take a moment.'; },
          contatti: 'Contact',
          bentornato: function (nome) { return nome ? 'Welcome back, ' + nome : 'Your previous order'; },
          conData: function (data) { return 'Here is what you requested on ' + data + '. You can still change quantities or remove items before sending.'; },
          senzaData: 'Here are the products from your last order.',
          pezzi: 'pcs',
          nonDisponibile: 'No longer available',
          cta: 'Edit and send the request',
          nota: 'We will take you to the contact form, already filled in: you can still change quantities or remove items.',
          dataLocale: 'en-GB',
        },
      };
      function lang() {
        try {
          if (window.CCI18n && typeof window.CCI18n.get === 'function') return window.CCI18n.get() === 'en' ? 'en' : 'it';
          return localStorage.getItem('cc-lang') === 'en' ? 'en' : 'it';
        } catch (e) { return 'it'; }
      }
      var t = function () { return T[lang()]; };

      var API = (window.CC_API || '') + '/api/riordino';

      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      };

      var eyebrow = document.getElementById('rd-eyebrow');
      var titolo = document.getElementById('rd-titolo');
      var sotto = document.getElementById('rd-sottotitolo');
      var contenuto = document.getElementById('rd-contenuto');

      /* la pagina si ridisegna da sola se la lingua cambia mentre è aperta
         (toggle IT/EN nel menu), rieseguendo l'ultima cosa disegnata */
      var ultimoDisegno = function () { eyebrow.textContent = t().eyebrow; titolo.textContent = t().caricamento; };

      function statoErrore() {
        var d = t();
        titolo.textContent = d.erroreTitolo;
        sotto.textContent = d.erroreSotto;
        var link = '<a href="contatti.html">' + esc(d.contatti) + '</a>';
        contenuto.innerHTML = '<p class="rd-stato">' + d.erroreCorpo(link) + '</p>';
        ultimoDisegno = statoErrore;
      }

      eyebrow.textContent = t().eyebrow;
      titolo.textContent = t().caricamento;

      var token = new URL(location.href).searchParams.get('t');
      if (!token || !/^[a-f0-9]{32}$/.test(token)) { statoErrore(); return; }

      fetch(API + '?t=' + encodeURIComponent(token), {
        headers: { Accept: 'application/json' }, referrerPolicy: 'no-referrer', cache: 'no-store',
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.ok) return statoErrore();
          disegna(d);
          ultimoDisegno = function () { disegna(d); };
        })
        .catch(statoErrore);

      function disegna(d) {
        var d18 = t();
        eyebrow.textContent = d18.eyebrow;

        var nome = d.cliente && d.cliente.nome ? d.cliente.nome.split(/\s+/)[0] : '';
        titolo.textContent = d18.bentornato(nome);
        var data = d.dataOrdine ? new Date(d.dataOrdine).toLocaleDateString(d18.dataLocale, { day: 'numeric', month: 'long', year: 'numeric' }) : '';
        sotto.textContent = data ? d18.conData(data) : d18.senzaData;

        var articoli = d.articoli || [];
        var righe = articoli.map(function (a) {
          return '<div class="rd-riga">'
            + (a.immagine ? '<img src="' + esc(a.immagine) + '" alt="">' : '')
            + '<div class="rd-riga-txt">'
            + '<p class="rd-riga-nome">' + esc(a.nome) + '</p>'
            + '<p class="rd-riga-qta">' + (a.quantita ? a.quantita + ' ' + d18.pezzi : '') + '</p>'
            + (a.disponibile ? '' : '<span class="rd-non-disp">' + esc(d18.nonDisponibile) + '</span>')
            + '</div></div>';
        }).join('');

        contenuto.innerHTML = righe
          + '<div class="rd-cta-wrap">'
          + '<button type="button" class="rd-cta" id="rd-riordina">' + esc(d18.cta) + '</button>'
          + '<p class="rd-nota">' + esc(d18.nota) + '</p>'
          + '</div>';

        document.getElementById('rd-riordina').addEventListener('click', function () {
          if (!window.CCSel) return;
          articoli.filter(function (a) { return a.disponibile; }).forEach(function (a) {
            CCSel.aggiungiProdotto({
              name: a.nome, img: a.immagine || '', imgProfumo: a.imgProfumo || '',
              qta: a.quantita || 0, oltre: !!a.oltre, cat: a.categoria || '', url: a.pagina || '',
            });
          });
          try {
            if (d.promemoriaId) sessionStorage.setItem('cc-promemoria-rif', d.promemoriaId);
          } catch (e) {}
          location.href = 'contatti.html';
        });
      }

      window.addEventListener('cc-lang:change', function () { ultimoDisegno(); });
      window.addEventListener('storage', function (e) { if (e.key === 'cc-lang') ultimoDisegno(); });
    })();
  </script>
</body>
</html>
